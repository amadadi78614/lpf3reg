<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LPFL Player Profiles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f7f6f2;--surface:#fff;--text:#28251d;--muted:#6f6b63;--border:rgba(40,37,29,.12);--primary:#01696f;--primary2:#0c4e54;--shadow:0 10px 30px rgba(30,20,10,.08);--radius:20px}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,sans-serif;background:linear-gradient(180deg,#fbfaf7 0%,var(--bg) 100%);color:var(--text)}
    .wrap{max-width:1500px;margin:0 auto;padding:24px}.header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}.title h1{margin:0;font-size:clamp(28px,4vw,48px);line-height:1.02}.title p{margin:8px 0 0;color:var(--muted);font-size:15px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.pill{background:rgba(1,105,111,.1);color:var(--primary);border:1px solid rgba(1,105,111,.18);padding:10px 14px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}.status-dot{width:10px;height:10px;border-radius:50%;background:#19c37d;display:inline-block;box-shadow:0 0 0 6px rgba(25,195,125,.12)}.btn{border:1px solid rgba(1,105,111,.18);background:#fff;color:var(--primary2);padding:10px 14px;border-radius:999px;font-weight:700;cursor:pointer}.btn:hover{background:#f4fbfa}
    .status{margin:0 0 18px;padding:12px 14px;border-radius:14px;border:1px solid var(--border);background:#fff;color:var(--muted);font-size:14px}
    .layout{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start}.sidebar,.profile{background:rgba(255,255,255,.88);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
    .sidebar{padding:16px;position:sticky;top:18px;max-height:calc(100vh - 36px);overflow:auto}.filters{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:12px}.filters select{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:14px;background:#fff;font:inherit}.list{display:flex;flex-direction:column;gap:8px}.player-btn{width:100%;text-align:left;padding:14px;border:1px solid var(--border);border-radius:16px;background:#fff;cursor:pointer}.player-btn.active{background:#eef6f5;border-color:rgba(1,105,111,.25)}.player-btn .n{font-weight:800;font-size:16px;margin-bottom:4px}.player-btn .m{font-size:13px;color:var(--muted)}
    .profile{overflow:hidden}.hero{display:grid;grid-template-columns:360px 1fr;min-height:680px}.photo{background:#ece8e1;position:relative}.photo img{width:100%;height:100%;object-fit:cover;display:block}.fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:96px;font-weight:800;color:#c2bbb1;background:linear-gradient(135deg,#f0ece6,#e4ddd3)}
    .content{padding:28px;display:flex;flex-direction:column;gap:18px}.name{font-size:clamp(44px,7vw,86px);line-height:.92;font-weight:800;letter-spacing:-.04em}.team{font-size:26px;font-weight:700;color:var(--primary2)}.meta{display:flex;flex-wrap:wrap;gap:10px}.chip{display:inline-flex;align-items:center;padding:10px 14px;border-radius:999px;background:#f4f1ec;border:1px solid var(--border);font-size:14px;font-weight:700}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.stat{padding:18px;border:1px solid var(--border);background:#fcfbf8;border-radius:18px}.stat .label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}.stat .value{font-size:28px;font-weight:800;line-height:1.1}
    .empty{padding:40px;color:var(--muted)}
    @media (max-width:1100px){.layout{grid-template-columns:1fr}.sidebar{position:relative;top:auto;max-height:none}.hero{grid-template-columns:1fr}.photo{aspect-ratio:4/3}} @media (max-width:620px){.wrap{padding:16px}.header{flex-direction:column}.content{padding:18px}.grid{grid-template-columns:1fr}.name{font-size:44px}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="title"><h1>LPFL Player Profiles</h1><p>Select a player on the left to view the full profile.</p></div>
      <div class="toolbar"><button class="btn" id="refreshBtn">Refresh now</button><div class="pill"><span class="status-dot"></span> Split profile view</div></div>
    </div>
    <div class="status" id="statusBox">Waiting to load player profiles…</div>
    <div class="layout">
      <aside class="sidebar">
        <div class="filters">
          <select id="ratingBand">
            <option value="all">All ratings</option>
            <option value="0-1.49">Playtomic rating 0 - 1.49</option>
            <option value="1.50-2.00">Playtomic rating 1.50 - 2.00</option>
            <option value="2.01-2.30">Playtomic rating 2.01 - 2.30</option>
            <option value="2.31-2.50">Playtomic rating 2.31 - 2.50</option>
            <option value="2.51+">Playtomic rating 2.51 +</option>
          </select>
        </div>
        <button class="btn" id="clearFilters" style="width:100%;margin-bottom:12px;">Clear filter</button>
        <div class="list" id="playerList"></div>
      </aside>
      <section class="profile" id="profilePane">
        <div class="empty">Choose a player from the list to view the profile.</div>
      </section>
    </div>
  </div>
<script>
const baseCsvUrl='https://docs.google.com/spreadsheets/d/e/2PACX-1vRawyxX3mmZnCP6G2zinsUk1ESpsEYQaf7AQ_yaeGrQ1lwBMEpXIPE7kOpJeUKU4R7pUQdqODtTbziA/pub?gid=829749545&single=true&output=csv';
const els={statusBox:document.getElementById('statusBox'),refreshBtn:document.getElementById('refreshBtn'),ratingBand:document.getElementById('ratingBand'),clearFilters:document.getElementById('clearFilters'),playerList:document.getElementById('playerList'),profilePane:document.getElementById('profilePane')};
let allRows=[]; let filteredPlayers=[]; let selectedKey='';
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function fullName(r){return [r['First Name'],r['Surname']].filter(Boolean).join(' ').trim()||'—';}
function parseCSV(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'){if(q&&n==='"'){cell+='"';i++;}else{q=!q;}}else if(c===','&&!q){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n') i++;row.push(cell);if(row.some(v=>String(v).trim()!=='')) rows.push(row);row=[];cell='';}else{cell+=c;}}if(cell.length||row.length){row.push(cell);rows.push(row);}const headers=rows.shift()||[];return rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]??''])));}
function driveImage(url){const m=String(url||'').match(/\/d\/([^/]+)/); return m ? `https://drive.google.com/uc?export=view&id=${m[1]}` : '';}
function playerKey(r){return `${String(r['Email']||'').trim().toLowerCase()}|${fullName(r).toLowerCase()}`;}
function uniqueRows(rows){const clean=rows.filter(r=>Object.values(r).some(v=>String(v||'').trim()!==''));clean.sort((a,b)=>new Date(b['Timestamp'])-new Date(a['Timestamp']));const seen=new Set();const unique=[];for(const r of clean){const key=playerKey(r);if(!seen.has(key)){seen.add(key);unique.push(r);}}return unique;}
function inBand(rating, band){if(Number.isNaN(rating)) return band==='all';if(band==='0-1.49') return rating>=0 && rating<=1.49;if(band==='1.50-2.00') return rating>=1.50 && rating<=2.00;if(band==='2.01-2.30') return rating>=2.01 && rating<=2.30;if(band==='2.31-2.50') return rating>=2.31 && rating<=2.50;if(band==='2.51+') return rating>=2.51;return true;}
function applyFilters(){const band=els.ratingBand.value;filteredPlayers=uniqueRows(allRows).filter(r=>inBand(parseFloat(r['Playtomic Rating']),band));renderList();if(!filteredPlayers.some(r=>playerKey(r)===selectedKey)){selectedKey=filteredPlayers[0]?playerKey(filteredPlayers[0]):'';}renderProfile();const label=els.ratingBand.options[els.ratingBand.selectedIndex].text;const now=new Intl.DateTimeFormat('en-ZA',{dateStyle:'medium',timeStyle:'medium'}).format(new Date());els.statusBox.textContent=`Showing ${filteredPlayers.length} players for ${label} at ${now}.`;}
function renderList(){els.playerList.innerHTML=filteredPlayers.map(r=>{const key=playerKey(r);const active=key===selectedKey?' active':'';return `<button class="player-btn${active}" data-key="${esc(key)}"><div class="n">${esc(fullName(r))}</div><div class="m">Rating ${esc(r['Playtomic Rating']||'—')} · ${esc(r['Season 2 Team']||'—')}</div></button>`;}).join('');document.querySelectorAll('.player-btn').forEach(btn=>btn.addEventListener('click',()=>{selectedKey=btn.dataset.key;renderList();renderProfile();}));}
function renderProfile(){const r=filteredPlayers.find(x=>playerKey(x)===selectedKey);if(!r){els.profilePane.innerHTML='<div class="empty">No player matches the current filter.</div>';return;}const name=fullName(r);const rating=r['Playtomic Rating']||'—';const team=r['Season 2 Team']||'—';const previousTeam=String(team).trim().toLowerCase()==='new player'?'New Player':team;const sides=r['Preferred Side']||'—';const handed=r['Handed']||'—';const img=driveImage(r['Photo URL']);const initials=(r['First Name']||name||'P').trim().charAt(0).toUpperCase();els.profilePane.innerHTML=`<div class="hero"><div class="photo">${img?`<img src="${esc(img)}" alt="${esc(name)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">`:''}<div class="fallback" style="display:${img?'none':'flex'}">${esc(initials)}</div></div><div class="content"><div><div class="name">${esc(name)}</div><div class="team">${esc(previousTeam)}</div></div><div class="meta"><span class="chip">Email: ${esc(r['Email']||'—')}</span><span class="chip">Shirt: ${esc(r['Shirt Size']||'—')}</span></div><div class="grid"><div class="stat"><div class="label">Playtomic rating</div><div class="value">${esc(rating)}</div></div><div class="stat"><div class="label">Preferred side</div><div class="value">${esc(sides)}</div></div><div class="stat"><div class="label">Handed</div><div class="value">${esc(handed)}</div></div><div class="stat"><div class="label">Previous team</div><div class="value">${esc(previousTeam)}</div></div></div></div></div>`;}
function fail(msg){els.playerList.innerHTML='';els.profilePane.innerHTML='<div class="empty">Could not load player profile.</div>';els.statusBox.textContent=msg;}
async function loadData(){els.refreshBtn.disabled=true;els.statusBox.textContent='Loading live player profiles from Google Sheets…';try{const url=`${baseCsvUrl}&t=${Date.now()}`;const res=await fetch(url,{cache:'no-store'});if(!res.ok) throw new Error(`HTTP ${res.status}`);const text=await res.text();if(!text || !text.startsWith('Timestamp,Email,First Name,Surname')) throw new Error('Unexpected CSV response');allRows=parseCSV(text);applyFilters();}catch(err){fail(`Could not load player profiles: ${err.message}`);}finally{els.refreshBtn.disabled=false;}}
els.refreshBtn.addEventListener('click',loadData);els.ratingBand.addEventListener('change',applyFilters);els.clearFilters.addEventListener('click',()=>{els.ratingBand.value='all';applyFilters();});loadData();setInterval(loadData,60000);
</script>
</body>
</html>
